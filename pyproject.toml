[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rebert"
version = "0.1.0"
description = "ReBERT: LLM for gate-level to word-level reverse engineering (DATE 2025)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Lizi Zhang" }]
requires-python = ">=3.9"
dependencies = [
    "torch",
    "transformers>=4.41",
    "accelerate",
    "safetensors",
    "scikit-learn",
    "scipy",
    "numpy",
    "pandas",
    "networkx",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools]
packages = ["rebert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
